name: AIMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_review_artifacts:
        description: Build and upload approved review artifacts after all eight certification jobs
        type: boolean
        default: false
  workflow_call:
    inputs:
      release_certification:
        description: Run all mandatory browser, recovery and Windows release checks
        type: boolean
        default: false
      build_review_artifacts:
        description: Build and upload review artifacts after all eight certification jobs
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  recovery-certification:
    name: Independent populated upgrade and recovery
    if: github.event_name == 'workflow_dispatch' || inputs.release_certification == true
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: certification-only-root
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.35'
          tools: composer:2.9.8
          extensions: bcmath, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
      - run: sudo apt-get update -qq && sudo apt-get install -y mariadb-client
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: python -m pip install --target backend/ml/optimizer_vendor -r backend/ml/supply_optimizer_requirements.txt
      - run: bash scripts/prepare-baseline-fixture.sh
      - run: php -d memory_limit=2048M scripts/certify-installation.php
      - run: node scripts/certify-interrupted-write.cjs
      - run: MYSQL_PWD=certification-only-root mariadb -h 127.0.0.1 -u root -e 'CREATE DATABASE aims_ci_recovery_a; CREATE DATABASE aims_ci_recovery_b;'
      - run: php -d memory_limit=2048M scripts/certify-mariadb-installation.php
        env:
          AIMS_CERTIFICATION_MYSQL: '1'
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: aims_ci_recovery_a
          AIMS_CERTIFICATION_RESTORE_DATABASE: aims_ci_recovery_b
          DB_USERNAME: root
          DB_PASSWORD: certification-only-root
          AIMS_MYSQL_CLIENT: mariadb
          AIMS_MYSQL_DUMP: mariadb-dump
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1-independent-recovery
          path: |
            output/pr1-independent-restore.json
            output/pr1-mariadb-populated-restore.json
  linux-server:
    name: Linux Nginx and supervised workers
    if: github.event_name == 'workflow_dispatch' || inputs.release_certification == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.35'
          tools: composer:2.9.8
          extensions: bcmath, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, zip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: python -m pip install --target backend/ml/optimizer_vendor -r backend/ml/supply_optimizer_requirements.txt
      - run: npm install --global npm@10.9.2
      - run: npm ci && npm run build
        working-directory: frontend
      - run: mkdir -p output && bash scripts/certify-linux-server.sh
        env:
          AIMS_CERTIFICATION_SERVER: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1-linux-server
          path: output/pr1-linux-*.json
  backend-tests:
    name: Backend tests (SQLite portable path)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.35'
          tools: composer:2.9.8
          extensions: bcmath, curl, openssl, zip, mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-php-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit --locked --no-dev
      - run: cp .env.example .env
      - run: php artisan key:generate --force
      - run: php artisan migrate:fresh --database=sqlite --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
      - run: python -m pip install --target ml/optimizer_vendor -r ml/supply_optimizer_requirements.txt
      - run: php artisan test
      - run: python -m unittest discover -s ml -p 'test_*.py'
      - run: python -m unittest discover -s ml/tests -p 'test_supply_optimizer.py'

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  backend-mariadb-migrations:
    name: Backend migrations (MariaDB server path)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MYSQL_DATABASE: aims_ci
          MYSQL_USER: aims
          MYSQL_PASSWORD: aims
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.35'
          tools: composer:2.9.8
          extensions: bcmath, curl, openssl, zip, mbstring, dom, fileinfo, pdo_mysql
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: python -m pip install --target ml/optimizer_vendor -r ml/supply_optimizer_requirements.txt
      - run: cp .env.example .env
      - run: php artisan key:generate --force
      - run: php artisan migrate:fresh --force
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aims_ci
          DB_USERNAME: aims
          DB_PASSWORD: aims
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
      - run: php artisan test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aims_ci
          DB_USERNAME: aims
          DB_PASSWORD: aims
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

      - name: DC1 two-connection bank reconciliation ownership
        run: |
          php -r '$pdo=new PDO("mysql:host=127.0.0.1;port=3306", "root", "root"); $pdo->exec("CREATE DATABASE aims_dc1_bank_ci_test");'
          php tests/Support/bank-match-concurrency.php
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aims_dc1_bank_ci_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          BROADCAST_CONNECTION: log

  browser-smoke:
    name: Browser smoke (Chromium + SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.35'
          tools: composer:2.9.8
          extensions: bcmath, curl, openssl, zip, mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - run: npm install --global npm@10.9.2
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e:smoke
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke-failure
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  browser-release:
    name: Browser release certification
    if: github.event_name == 'workflow_dispatch' || inputs.release_certification == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.35'
          tools: composer:2.9.8
          extensions: bcmath, curl, openssl, zip, mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - run: npm install --global npm@10.9.2
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m pip install --target backend/ml/optimizer_vendor -r backend/ml/supply_optimizer_requirements.txt
      - run: npm run test:e2e:release
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-release-certification
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 14

  desktop-startup:
    name: Desktop bundled startup (Windows + SQLite)
    if: github.event_name == 'workflow_dispatch' || inputs.release_certification == true
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.35'
          tools: composer:2.9.8
          extensions: bcmath, curl, openssl, zip, mbstring, dom, fileinfo, pdo_sqlite, sqlite3, sodium
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - run: npm install --global npm@10.9.2
      - run: npm ci
        working-directory: frontend
      - run: npm install --global npm@10.9.2
      - run: npm ci
        working-directory: desktop
      - run: npm audit --omit=dev --audit-level=high
        working-directory: desktop
      - run: python -m pip install --target backend/ml/optimizer_vendor -r backend/ml/supply_optimizer_requirements.txt
      - run: ./scripts/download-desktop-php.ps1
      - run: npm run test:startup
        working-directory: desktop
      - run: npm test
        working-directory: desktop

  web-artifact:
    if: inputs.build_review_artifacts == true
    needs: [backend-tests, backend-mariadb-migrations, frontend-build, browser-smoke, browser-release, desktop-startup, recovery-certification, linux-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: npm install --global npm@10.9.2
      - run: npm ci && npm run build
        working-directory: frontend
      - run: |
          mkdir -p output
          git archive --format=tar --output=output/aims-web-source.tar HEAD backend deploy scripts RELEASE.json docs
          tar --append --file=output/aims-web-source.tar frontend/dist
          gzip -n output/aims-web-source.tar
          sha256sum output/aims-web-source.tar.gz > output/SHA256SUMS
          sha256sum --check output/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aims-web-uncertified-candidate-${{ github.sha }}
          path: |
            output/aims-web-source.tar.gz
            output/SHA256SUMS
            RELEASE.json
  desktop-artifact:
    if: inputs.build_review_artifacts == true
    needs: [backend-tests, backend-mariadb-migrations, frontend-build, browser-smoke, browser-release, desktop-startup, recovery-certification, linux-server]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.35'
          tools: composer:2.9.8
          extensions: bcmath, curl, dom, fileinfo, mbstring, openssl, pdo_sqlite, sqlite3, zip, sodium
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.2'
      - run: npm install --global npm@10.9.2
      - run: composer install --no-dev --no-interaction --prefer-dist
        working-directory: backend
      - run: python -m pip install --target backend/ml/optimizer_vendor -r backend/ml/supply_optimizer_requirements.txt
      - run: ./scripts/download-desktop-php.ps1
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - shell: pwsh
        run: |
          $files = Get-ChildItem desktop/dist -File -Filter '*.exe'
          if ($files.Count -ne 1) { throw 'Exactly one desktop installer required.' }
          $files | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name } | Set-Content desktop/dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: aims-windows-unsigned-test-candidate-${{ github.sha }}
          path: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS
  candidate:
    if: inputs.build_review_artifacts == true
    needs: [web-artifact, desktop-artifact]
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Required automated checks passed. Candidate artifacts are for review; customer release still requires the signed installer and completed operational checklist.' >> "$GITHUB_STEP_SUMMARY"
