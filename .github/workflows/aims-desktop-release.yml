name: AIMS signed desktop release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  windows-release:
    needs: validation
    runs-on: windows-latest
    steps:
      - name: Check out AIMS
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, openssl, pdo_sqlite, sqlite3, fileinfo, curl, zip
          tools: composer:v2

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build web interface
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare local forecasting runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned local supply optimizer
        run: python -m pip install --target backend/ml/optimizer_vendor -r backend/ml/supply_optimizer_requirements.txt

      - name: Install Electron dependencies
        working-directory: desktop
        run: npm ci

      - name: Test desktop recovery guards
        working-directory: desktop
        run: npm test

      - name: Verify self-contained desktop startup
        working-directory: desktop
        run: npm run test:startup

      - name: Build and sign without publishing
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.AIMS_WINDOWS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.AIMS_WINDOWS_CERTIFICATE_PASSWORD }}
        run: npm run dist:win:signed

      - name: Verify installer signature
        working-directory: desktop
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "dist/AIMS-Setup-$version.exe"
          foreach ($file in @($installer, 'dist/win-unpacked/AIMS.exe')) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne 'Valid') { throw "Signature is not valid for ${file}: $($signature.Status)" }
          }

      - name: Publish verified artifacts
        working-directory: desktop
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          gh release create "v$version" "dist/AIMS-Setup-$version.exe" "dist/AIMS-Setup-$version.exe.blockmap" "dist/latest.yml" --title "AIMS $version" --generate-notes
